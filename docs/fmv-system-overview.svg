<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" width="1180" height="460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#63696F"/>
    </marker>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8B3A3A"/>
    </marker>
  </defs>

  <rect width="1180" height="460" fill="#FFFFFF"/>
  <text x="34" y="42" font-size="21" font-weight="700" fill="#1F3A5F">Fair Market Value Review — System Overview</text>
  <text x="34" y="64" font-size="12" fill="#63696F">Guided intake → market-approach analysis → committee-ready deliverables</text>

  <!-- LANE 1: GUIDED INTAKE -->
  <rect x="30" y="90" width="330" height="250" rx="8" fill="#F7F9FC" stroke="#C9D6E4" stroke-dasharray="5 4"/>
  <text x="195" y="112" font-size="11" font-weight="700" fill="#1F3A5F" text-anchor="middle" letter-spacing="1.1">GUIDED INTAKE</text>

  <rect x="52" y="128" width="286" height="34" rx="5" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>
  <circle cx="72" cy="145" r="10" fill="#1F3A5F"/>
  <text x="72" y="149" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="90" y="143" font-size="12.5" font-weight="600" fill="#23262B">Survey data</text>
  <text x="90" y="156" font-size="10" fill="#63696F">workbook · paste · anchors</text>

  <rect x="52" y="168" width="286" height="34" rx="5" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>
  <circle cx="72" cy="185" r="10" fill="#1F3A5F"/>
  <text x="72" y="189" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="90" y="183" font-size="12.5" font-weight="600" fill="#23262B">Provider</text>
  <text x="90" y="196" font-size="10" fill="#63696F">specialty, experience, FTE</text>

  <rect x="52" y="208" width="286" height="34" rx="5" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>
  <circle cx="72" cy="225" r="10" fill="#1F3A5F"/>
  <text x="72" y="229" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="90" y="223" font-size="12.5" font-weight="600" fill="#23262B">Compensation</text>
  <text x="90" y="236" font-size="10" fill="#63696F">base + components</text>

  <rect x="52" y="248" width="286" height="34" rx="5" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>
  <circle cx="72" cy="265" r="10" fill="#1F3A5F"/>
  <text x="72" y="269" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="90" y="263" font-size="12.5" font-weight="600" fill="#23262B">Productivity</text>
  <text x="90" y="276" font-size="10" fill="#63696F">total annual wRVUs</text>

  <rect x="52" y="288" width="286" height="34" rx="5" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>
  <circle cx="72" cy="305" r="10" fill="#1F3A5F"/>
  <text x="72" y="309" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="90" y="303" font-size="12.5" font-weight="600" fill="#23262B">Proposal</text>
  <text x="90" y="316" font-size="10" fill="#63696F">or none, for a new hire</text>

  <!-- LANE 2: ANALYSIS -->
  <rect x="392" y="90" width="330" height="250" rx="8" fill="#FDF7F7" stroke="#D9B4B4" stroke-dasharray="5 4"/>
  <text x="557" y="112" font-size="11" font-weight="700" fill="#8B3A3A" text-anchor="middle" letter-spacing="1.1">MARKET-APPROACH ANALYSIS</text>

  <rect x="414" y="128" width="286" height="46" rx="5" fill="#FFFFFF" stroke="#8B3A3A" stroke-width="1.6"/>
  <text x="428" y="147" font-size="12.5" font-weight="600" fill="#8B3A3A">Blend by sample size</text>
  <text x="428" y="164" font-size="10.5" fill="#63696F">Σ(pXX × n) ÷ Σn · suppressed sources excluded</text>

  <rect x="414" y="182" width="286" height="46" rx="5" fill="#FFFFFF" stroke="#8B3A3A" stroke-width="1.6"/>
  <text x="428" y="201" font-size="12.5" font-weight="600" fill="#8B3A3A">Percentile positioning</text>
  <text x="428" y="218" font-size="10.5" fill="#63696F">TCC · wRVU · comp-per-wRVU (directional)</text>

  <rect x="414" y="236" width="286" height="56" rx="5" fill="#F7EEEE" stroke="#8B3A3A" stroke-width="2.2"/>
  <text x="428" y="255" font-size="12.5" font-weight="700" fill="#8B3A3A">⚑ Alignment check</text>
  <text x="428" y="272" font-size="10.5" fill="#63696F">Does pay track production? Gap &gt; 15 pts</text>
  <text x="428" y="286" font-size="10.5" fill="#63696F">→ flag, and document the business reason</text>

  <rect x="414" y="300" width="286" height="26" rx="5" fill="#FFFFFF" stroke="#C9D6E4"/>
  <text x="428" y="317" font-size="10.5" fill="#63696F">Caveats: blend overlap · lag · definitions · n</text>

  <!-- LANE 3: DELIVERABLES -->
  <rect x="754" y="90" width="396" height="250" rx="8" fill="#F5FAF7" stroke="#B4D4C2" stroke-dasharray="5 4"/>
  <text x="952" y="112" font-size="11" font-weight="700" fill="#2E6B4F" text-anchor="middle" letter-spacing="1.1">DELIVERABLES</text>

  <rect x="776" y="128" width="176" height="52" rx="5" fill="#FFFFFF" stroke="#2E6B4F" stroke-width="1.6"/>
  <text x="790" y="147" font-size="12" font-weight="600" fill="#23262B">Review workbook</text>
  <text x="790" y="163" font-size="10" fill="#63696F">formulas preserved</text>
  <text x="790" y="175" font-size="10" fill="#63696F">verified 6/6 on re-open</text>

  <rect x="964" y="128" width="176" height="52" rx="5" fill="#FFFFFF" stroke="#2E6B4F" stroke-width="1.6"/>
  <text x="978" y="147" font-size="12" font-weight="600" fill="#23262B">DOCX + PDF packet</text>
  <text x="978" y="163" font-size="10" fill="#63696F">KPI cards · callouts</text>
  <text x="978" y="175" font-size="10" fill="#63696F">market-band exhibit</text>

  <rect x="776" y="190" width="176" height="52" rx="5" fill="#FFFFFF" stroke="#2E6B4F" stroke-width="1.6"/>
  <text x="790" y="209" font-size="12" font-weight="600" fill="#23262B">HTML email</text>
  <text x="790" y="225" font-size="10" fill="#63696F">self-contained</text>
  <text x="790" y="237" font-size="10" fill="#63696F">0.6" margin PDF</text>

  <rect x="964" y="190" width="176" height="52" rx="5" fill="#FFFFFF" stroke="#2E6B4F" stroke-width="1.6"/>
  <text x="978" y="209" font-size="12" font-weight="600" fill="#23262B">New-hire range</text>
  <text x="978" y="225" font-size="10" fill="#63696F">p25–p50 band</text>
  <text x="978" y="237" font-size="10" fill="#63696F">equity caveat</text>

  <rect x="776" y="252" width="364" height="40" rx="5" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>
  <text x="790" y="270" font-size="12" font-weight="600" fill="#1F3A5F">Session log + request register</text>
  <text x="790" y="285" font-size="10" fill="#63696F">reproducible audit trail · intake → committee decision</text>

  <rect x="776" y="300" width="364" height="26" rx="5" fill="#EEF2F7" stroke="#C9D6E4"/>
  <text x="790" y="317" font-size="10.5" fill="#1F3A5F">Market-approach analysis — not a certified FMV opinion</text>

  <!-- flow arrows -->
  <line x1="360" y1="215" x2="390" y2="215" stroke="#63696F" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="722" y1="215" x2="752" y2="215" stroke="#63696F" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- setup + confirm loop -->
  <rect x="30" y="368" width="330" height="58" rx="6" fill="#FFFFFF" stroke="#1F3A5F" stroke-dasharray="4 3"/>
  <text x="46" y="389" font-size="11.5" font-weight="700" fill="#1F3A5F">First run: setup flow</text>
  <text x="46" y="406" font-size="10.5" fill="#63696F">inspect_workbook.py reads YOUR files and</text>
  <text x="46" y="419" font-size="10.5" fill="#63696F">proposes column mappings — never assumes a layout</text>
  <line x1="195" y1="366" x2="195" y2="344" stroke="#1F3A5F" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <rect x="392" y="368" width="330" height="58" rx="6" fill="#F7EEEE" stroke="#8B3A3A" stroke-dasharray="4 3"/>
  <text x="408" y="389" font-size="11.5" font-weight="700" fill="#8B3A3A">Before anything is generated</text>
  <text x="408" y="406" font-size="10.5" fill="#63696F">every input labeled from-file / user / derived,</text>
  <text x="408" y="419" font-size="10.5" fill="#63696F">blended math shown in real numbers, explicit go-ahead</text>
  <line x1="557" y1="366" x2="557" y2="344" stroke="#8B3A3A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arL)"/>

  <rect x="754" y="368" width="396" height="58" rx="6" fill="#FFFFFF" stroke="#63696F" stroke-dasharray="4 3"/>
  <text x="770" y="389" font-size="11.5" font-weight="700" fill="#1F3A5F">Zero-state tutorial</text>
  <text x="770" y="406" font-size="10.5" fill="#63696F">A vague first message ("fmv", "help") triggers an orientation</text>
  <text x="770" y="419" font-size="10.5" fill="#63696F">that teaches the workflow before asking a single question.</text>
  <line x1="952" y1="366" x2="952" y2="344" stroke="#63696F" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
</svg>
